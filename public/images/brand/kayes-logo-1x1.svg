<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Steel Metallic Rim Gradient -->
    <linearGradient id="steelRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="35%" stop-color="#1a202c" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Platinum Chrome Rim Highlight -->
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Diamond Facet Highlights -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="facetCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Outer Ambient Glow -->
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#emblemGlow)" />

  <!-- Main Outer Grinding Wheel Profile -->
  <g filter="url(#softShadow)">
    <!-- Outer Segmented Industrial Grinding Rim -->
    <circle cx="256" cy="256" r="216" fill="url(#steelRing)" stroke="url(#chromeBevel)" stroke-width="4" />
    
    <!-- Segment Notches (Diamond Wheel Gullets) -->
    <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="2 32" stroke-opacity="0.4" />
    <circle cx="256" cy="256" r="206" fill="none" stroke="#000000" stroke-width="3" opacity="0.4" />

    <!-- Inner Metallic Core Rim -->
    <circle cx="256" cy="256" r="162" fill="#ffffff" stroke="url(#chromeBevel)" stroke-width="6" />
    <circle cx="256" cy="256" r="156" fill="#f8fafc" />
    <circle cx="256" cy="256" r="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

  <!-- Precision Faceted Diamond Superabrasive Emblem in Center -->
  <g transform="translate(256, 252)">
    <!-- Cyan/Platinum Interior Refraction -->
    <polygon points="0,-95 110,-35 0,105 -110,-35" fill="url(#facetCyan)" />

    <!-- Main Diamond Outline -->
    <path 
      d="M -115,-35 L -65,-95 L 65,-95 L 115,-35 L 0,105 Z" 
      fill="#ffffff" 
      stroke="#0f172a" 
      stroke-width="10" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- Diamond Table Facet (Top Center Trapezoid) -->
    <polygon points="-48,-95 48,-95 30,-35 -30,-35" fill="#f1f5f9" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />

    <!-- Upper Star & Kite Facets (Left & Right) -->
    <polygon points="-65,-95 -48,-95 -30,-35 -85,-35" fill="#e2e8f0" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    <polygon points="65,-95 48,-95 30,-35 85,-35" fill="#ffffff" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    <polygon points="-115,-35 -65,-95 -85,-35" fill="#cbd5e1" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    <polygon points="115,-35 65,-95 85,-35" fill="#f8fafc" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />

    <!-- Lower Pavilion Facets (Bottom Triangular Reflections) -->
    <!-- Center Main Keel -->
    <polygon points="-30,-35 0,-35 0,105" fill="#334155" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    <polygon points="0,-35 30,-35 0,105" fill="#e2e8f0" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Left Pavilion Ribs -->
    <polygon points="-85,-35 -30,-35 0,105" fill="#1e293b" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    <polygon points="-115,-35 -85,-35 0,105" fill="#475569" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />

    <!-- Right Pavilion Ribs -->
    <polygon points="30,-35 85,-35 0,105" fill="#f1f5f9" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
    <polygon points="85,-35 115,-35 0,105" fill="#cbd5e1" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />

    <!-- Specular Light Sheen across Table -->
    <polygon points="-48,-95 10,-95 -10,-35 -30,-35" fill="url(#facetLight)" opacity="0.6" />
    
    <!-- Brilliance Star Sparkle on Crown Corner -->
    <g transform="translate(62, -92)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#38bdf8" opacity="0.9" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>
